<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OpenAvisio</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f7f3e8; color: #654735;
      padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) { body { background: #32302f; color: #d4be98; } }
    main { width: 100%; max-width: 22rem; text-align: center; }
    img { width: 6rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    p { font-size: 0.85rem; opacity: 0.7; margin: 0 0 1.5rem; }
    input[type="url"] {
      width: 100%; box-sizing: border-box; padding: 0.75rem 1rem; font-size: 1rem;
      border: 1px solid #d9d1ba; border-radius: 0.5rem; background: transparent; color: inherit;
    }
    @media (prefers-color-scheme: dark) { input[type="url"] { border-color: #5a524c; } }
    label { display: flex; gap: 0.5rem; align-items: center; justify-content: center;
            font-size: 0.85rem; margin-top: 1rem; }
    button {
      width: 100%; margin-top: 0.75rem; padding: 0.75rem 1rem; font-size: 1rem;
      border: none; border-radius: 0.5rem; background: #c35e0a; color: #f7f3e8; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { background: #e78a4e; color: #282828; } }
    button:disabled { opacity: 0.5; }
    #error { color: #c14a4a; font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.75rem; }
    @media (prefers-color-scheme: dark) { #error { color: #ea6962; } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" />
    <h1>OpenAvisio</h1>
    <p id="tagline">Mit deinem Server verbinden<br />Connect to your server</p>
    <form id="form">
      <input id="url" type="url" placeholder="https://meine-praxis.openavisio.org"
             autocapitalize="none" autocorrect="off" spellcheck="false" required />
      <label id="lockRow" class="hidden">
        <input id="lock" type="checkbox" />
        App-Sperre (Face ID / Fingerabdruck)
      </label>
      <button id="go" type="submit">Verbinden / Connect</button>
    </form>
    <button id="unlock" class="hidden" type="button">Entsperren / Unlock</button>
    <div id="error"></div>
  </main>
  <script src="shell.js"></script>
</body>
</html>
