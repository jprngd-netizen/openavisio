# OpenAvisio — Mac Mini homelab
# IA: OmniRoute (Tailscale 100.102.64.95:20128) em vez de Ollama local
# Sem Caddy interno — VPS Caddy reverse-proxies para 192.168.0.9:9340 (frontend) e :9341 (api)

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    container_name: openavisio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vaultdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - openavisio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d vaultdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: openavisio-redis
    networks:
      - openavisio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aiservice:
    build:
      context: ./aiservice
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: openavisio-aiservice
    environment:
      AISERVICE_TOKEN: ${AISERVICE_TOKEN}
      AI_BACKEND: ${AI_BACKEND:-vllm}
      VLLM_URL: ${VLLM_URL}
      VLLM_MODEL: ${VLLM_MODEL}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CLASSIFY_MODEL: ${OLLAMA_CLASSIFY_MODEL:-}
      OLLAMA_EXTRACT_MODEL: ${OLLAMA_EXTRACT_MODEL:-}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
    networks:
      - openavisio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    restart: unless-stopped
    container_name: openavisio-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/vaultdb
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://aiservice:8000
      AISERVICE_TOKEN: ${AISERVICE_TOKEN}
      APP_SECRET: ${APP_SECRET}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      DOCUMENT_STORAGE_PATH: /data/documents
      EMBEDDING_SCHEDULER_CRON: ${EMBEDDING_SCHEDULER_CRON:-*/15 * * * *}
      EMBEDDING_SCHEDULER_BATCH_SIZE: ${EMBEDDING_SCHEDULER_BATCH_SIZE:-50}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: https://${DOMAIN}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-${DOMAIN}}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-OpenAvisio}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-https://${DOMAIN}}
      ENVIRONMENT: production
      MEMED_API_URL: ${MEMED_API_URL:-}
      MEMED_SCRIPT_URL: ${MEMED_SCRIPT_URL:-}
      MEMED_API_KEY: ${MEMED_API_KEY:-}
      MEMED_SECRET_KEY: ${MEMED_SECRET_KEY:-}
      MEMED_ENVIRONMENT: ${MEMED_ENVIRONMENT:-integration}
      AGE_PUBKEY: ${AGE_PUBKEY:-}
    volumes:
      - document-data:/data/documents
    networks:
      - openavisio-net
    ports:
      - "9341:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aiservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app worker -Q celery --loglevel=info --concurrency=2
    restart: unless-stopped
    container_name: openavisio-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/vaultdb
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://aiservice:8000
      AISERVICE_TOKEN: ${AISERVICE_TOKEN}
      APP_SECRET: ${APP_SECRET}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      APP_URL: https://${DOMAIN}
      DOCUMENT_STORAGE_PATH: /data/documents
      MEMED_API_URL: ${MEMED_API_URL:-}
      MEMED_SCRIPT_URL: ${MEMED_SCRIPT_URL:-}
      MEMED_API_KEY: ${MEMED_API_KEY:-}
      MEMED_SECRET_KEY: ${MEMED_SECRET_KEY:-}
      MEMED_ENVIRONMENT: ${MEMED_ENVIRONMENT:-integration}
      AGE_PUBKEY: ${AGE_PUBKEY:-}
    volumes:
      - document-data:/data/documents
    networks:
      - openavisio-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-gpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app worker -Q gpu --loglevel=info --concurrency=1
    restart: unless-stopped
    container_name: openavisio-celery-gpu
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/vaultdb
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://aiservice:8000
      AISERVICE_TOKEN: ${AISERVICE_TOKEN}
      APP_SECRET: ${APP_SECRET}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      APP_URL: https://${DOMAIN}
      DOCUMENT_STORAGE_PATH: /data/documents
      MEMED_API_URL: ${MEMED_API_URL:-}
      MEMED_SCRIPT_URL: ${MEMED_SCRIPT_URL:-}
      MEMED_API_KEY: ${MEMED_API_KEY:-}
      MEMED_SECRET_KEY: ${MEMED_SECRET_KEY:-}
      MEMED_ENVIRONMENT: ${MEMED_ENVIRONMENT:-integration}
      AGE_PUBKEY: ${AGE_PUBKEY:-}
    volumes:
      - document-data:/data/documents
    networks:
      - openavisio-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    container_name: openavisio-beat
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/vaultdb
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://aiservice:8000
      AISERVICE_TOKEN: ${AISERVICE_TOKEN}
      APP_SECRET: ${APP_SECRET}
      EMBEDDING_SCHEDULER_CRON: ${EMBEDDING_SCHEDULER_CRON:-*/15 * * * *}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY}
      AGE_PUBKEY: ${AGE_PUBKEY:-}
    networks:
      - openavisio-net
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    container_name: openavisio-frontend
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${APP_SECRET}
      API_URL: http://openavisio-backend:8000
      PREVIEW_BANNER: ${PREVIEW_BANNER:-true}
    ports:
      - "9340:3000"
    networks:
      - openavisio-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',(r)=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: openavisio-backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vaultdb
      AGE_PUBKEY: ${AGE_PUBKEY}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      RETENTION_CLINICAL_DAYS: ${RETENTION_CLINICAL_DAYS:-90}
      RETENTION_KEYSTORE_DAYS: ${RETENTION_KEYSTORE_DAYS:-7}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - document-data:/data/documents:ro
      - ${BACKUP_DIR:-/opt/openavisio-backups}:/backups
    networks:
      - openavisio-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  openavisio-net:
    driver: bridge

volumes:
  postgres-data:
  document-data:
