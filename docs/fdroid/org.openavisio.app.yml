# Reference copy of the fdroiddata metadata for OpenAvisio.
# Authoritative file lives in fdroid/fdroiddata as metadata/org.openavisio.app.yml.
#
# VERIFIED green on F-Droid's upstream buildserver, and locally clean via
# `fdroid lint org.openavisio.app` + `fdroid rewritemeta` (fdroidserver 2.4.5).
# ALWAYS run those two locally before touching this recipe - it's what stops the
# review ping-pong (CONTRIBUTING.md: "fdroid lint ... doesn't report warnings").
#
# Reviewer-enforced conventions baked in here:
#   - commit is the FULL hash of the built commit in the public repository, never a tag/branch.
#   - subdir is the app MODULE (mobile/android/app) = where build/ is generated;
#     with that, fdroid finds the APK by default, so no `output:` is needed. gradle
#     searches up for settings.gradle, so it still builds the multi-module project.
#   - prebuild is a LIST of commands (fdroid joins them with `;` in one shell, so
#     the leading `cd ../..` persists) - never join with && or ; yourself.
#   - Node comes from Debian (Capacitor 7 needs only Node 20; ADR 035). pnpm pinned
#     to 9.15.9 via npm -g (Node 20 corepack can't load pnpm 11 ESM).
#   - scandelete path is relative to the repo root and version-pinned to the CLI.
#   - No Name/Summary/Description here - those live in fastlane (mobile/android/app/fastlane).
# The `commit:` below is release-specific; bump it (to the new public-repo commit) each release.

Categories:
  - Health Manager
License: AGPL-3.0-only
AuthorName: OpenAvisio
WebSite: https://openavisio.org
# Point these at the public repository that hosts this fork's source.
SourceCode: https://github.com/jprngd-netizen/openavisio
IssueTracker: https://github.com/jprngd-netizen/openavisio/issues

RepoType: git
Repo: https://github.com/jprngd-netizen/openavisio.git

Builds:
  - versionName: 0.1.0-beta
    versionCode: 1
    commit: e74326798c5ce5c52ec67a758a60002aed6a01da
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - npm install -g pnpm@9.15.9
    gradle:
      - yes
    prebuild:
      - cd ../..
      - CI=true pnpm install --frozen-lockfile
      - CI=true pnpm exec cap sync android
    scandelete:
      - mobile/node_modules/.pnpm/@capacitor+cli@7.6.8/node_modules/@capacitor/cli/assets

AutoUpdateMode: None
UpdateCheckMode: Static
CurrentVersion: 0.1.0-beta
CurrentVersionCode: 1
