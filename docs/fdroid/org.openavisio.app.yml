# Reference copy of the fdroiddata metadata for OpenAvisio.
# The authoritative file lives in fdroid/fdroiddata as metadata/org.openavisio.app.yml.
#
# This recipe is VERIFIED: it built green on F-Droid's own buildserver
# (MR fdroid/fdroiddata!43322). Notes on the non-obvious bits:
#   - Node 22 via NodeSource: the F-Droid VM ships Node 20, but @capacitor/cli 8 needs >=22.
#   - pnpm pinned to 9.15.9 via npm -g: Node 20's corepack can't load pnpm 11 (ESM); pinning
#     also survived (lockfile is v9.0). Kept even with Node 22 for determinism.
#   - prebuild uses `pnpm exec cap`, not npx (@capacitor/cli is a devDep, resolves locally);
#     CI=true so cap sync's inner pnpm install runs head-less.
#   - output: points at the app MODULE's APK (multi-module gradle; fdroid looks in subdir/build by default).
#   - scandelete: removes @capacitor/cli scaffolding .tar.gz templates the scanner flags (unused by the build).

Categories:
  - Science & Education
License: AGPL-3.0-only
AuthorName: OpenAvisio
WebSite: https://openavisio.org
SourceCode: https://codeberg.org/openavisio/openavisio
IssueTracker: https://codeberg.org/openavisio/openavisio/issues

RepoType: git
Repo: https://codeberg.org/openavisio/openavisio.git

Builds:
  - versionName: 0.1.0-beta
    versionCode: 1
    commit: v0.1.0-beta
    subdir: mobile/android
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - npm install -g pnpm@9.15.9
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild: cd .. && CI=true pnpm install --frozen-lockfile && CI=true pnpm exec
      cap sync android
    scandelete:
      - mobile/node_modules/.pnpm/@capacitor+cli@8.4.1/node_modules/@capacitor/cli/assets

AutoUpdateMode: None
UpdateCheckMode: Static
CurrentVersion: 0.1.0-beta
CurrentVersionCode: 1
